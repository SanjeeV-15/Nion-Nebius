<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nion</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <h1>Nion</h1>
    <p id="status" aria-live="polite">Tap the button to turn Nion on.</p>
    <button id="start" type="button">Turn on Nion</button>
    <button id="convo" type="button" hidden>Start conversation</button>
    <p id="heard" class="heard" aria-live="polite"></p>
    <p id="problem" class="problem" role="alert" hidden></p>
    <button id="copylog" type="button" hidden>Copy debug log</button>
    <pre id="debug" class="debug" hidden></pre>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
