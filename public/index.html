<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <title>Nion</title>
  <!-- So Nion can be added to a phone's home screen and opens like an app. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nion">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <h1 class="wordmark">Nion</h1>

    <!-- The one icon that shows what Nion is doing. ui.js sets data-state to
         off, waiting, listening, thinking or speaking, and the CSS shows the
         matching picture. -->
    <div id="orb" class="orb" data-state="off" role="img" aria-label="Nion is off">
      <!-- waiting: a quiet ring that slowly breathes -->
      <svg class="icon icon-waiting" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring" cx="32" cy="32" r="18"/>
        <circle class="core" cx="32" cy="32" r="3.5"/>
      </svg>
      <!-- listening: a microphone with a soft pulse -->
      <svg class="icon icon-listening" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="pulse" cx="32" cy="32" r="20"/>
        <rect x="26" y="14" width="12" height="22" rx="6"/>
        <path d="M19 30a13 13 0 0 0 26 0M32 43v8"/>
      </svg>
      <!-- thinking: three dots that bounce in turn -->
      <svg class="icon icon-thinking" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="dot d1" cx="16" cy="32" r="4.5"/>
        <circle class="dot d2" cx="32" cy="32" r="4.5"/>
        <circle class="dot d3" cx="48" cy="32" r="4.5"/>
      </svg>
      <!-- speaking: a speaker with waves that ripple outward -->
      <svg class="icon icon-speaking" viewBox="0 0 64 64" aria-hidden="true">
        <path class="body" d="M12 26h9l12-10v32L21 38h-9z"/>
        <path class="wave w1" d="M40 26a8 8 0 0 1 0 12"/>
        <path class="wave w2" d="M45 20a15 15 0 0 1 0 24"/>
        <path class="wave w3" d="M50 14a22 22 0 0 1 0 36"/>
      </svg>
    </div>

    <p id="status" class="status" aria-live="polite">Tap the button to turn Nion on.</p>

    <div class="actions">
      <button id="start" class="pill" type="button">Turn on Nion</button>
      <button id="convo" class="pill" type="button" hidden>Start conversation</button>
    </div>

    <!-- The last thing said and what Nion answered, shown quietly as text. app.js fills it in. -->
    <section id="exchange" class="exchange" aria-live="polite" hidden>
      <p id="ex-q" class="ex-q"></p>
      <p id="ex-a" class="ex-a"></p>
      <p id="ex-sources" class="ex-sources"></p>
    </section>

    <!-- Prefer to type, or can't use a microphone? Same Nion, answers shown on screen. -->
    <form id="typed" class="typed" autocomplete="off">
      <input id="typed-input" type="text" maxlength="500" placeholder="Or type to Nion…" aria-label="Type a message to Nion">
      <button class="pill small" type="submit">Send</button>
    </form>

    <p><a class="history-link" href="/notebook.html">Notebook</a> &nbsp;·&nbsp; <a class="history-link" href="/history.html">History</a></p>

    <p id="heard" class="heard" aria-live="polite" hidden></p>
    <p id="problem" class="problem" role="alert" hidden></p>

    <button id="copylog" class="pill small" type="button" hidden>Copy debug log</button>
    <pre id="debug" class="debug" hidden></pre>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
